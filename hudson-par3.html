     Score against par; the lowest 9-hole round is the record. Keyboard, controller and touch. All built in code.

  if (p.pending === 'drop') { var ls2 = p.lastSafe || [0, 0.6]; p.x = ls2[0]; p.z = ls2[1]; p.y = heightAt(p.x, p.z); p.vx = p.vz = p.vy = 0; p.lie = surfaceAt(p.x, p.z); if (p.strokes >= 8) { p.scores[G.hole] = p.strokes; p.done = true; message('PICK UP', 'max 8 on the hole', 1.6); } }
  p.pending = null;
  if (G.players.every(function (q) { return q.done; })) { if (G.hole + 1 < HOLES.length) { G.hole++; startHole(G.hole); } else finishRound(); return; }
  // the player furthest from the pin plays next
  var best = -1, bd = -1; G.players.forEach(function (q, k) { if (q.done) return; var d = distToPin(q); if (d > bd) { bd = d; best = k; } });
  G.cur = best; var q = G.players[G.cur]; q.club = autoClub(distToPin(q), q.lie === 'green'); G.aim = Math.atan2(H.green[0] - q.x, H.green[1] - q.z); G.phase = 'aim'; G.swing = null; placeBall(q); snapCam(q); trail.geometry.setFromPoints([]);
  if (G.np > 1) message(q.name, 'stroke ' + (q.strokes + 1) + ' · ' + Math.round(distToPin(q) * YD) + ' yds', 1.1);
}
function finishRound() {
  var p0 = G.players[0], tot = p0.scores.reduce(function (a, b) { return a + b; }, 0);
  if (G.np === 1 && (!SAVE.best || tot < SAVE.best)) SAVE.best = tot;
  persist(); post('over', { score: SAVE.best, total: tot, players: G.np });
  var rows = '<table class="sc"><tr><th></th>' + HOLES.map(function (h) { return '<th>' + h.n + '</th>'; }).join('') + '<th>TOT</th><th>PAR</th></tr>' + G.players.map(function (p) { var t = p.scores.reduce(function (a, b) { return a + b; }, 0); return '<tr><td class="n">' + p.name + '</td>' + p.scores.map(function (s) { return '<td class="' + (s < 3 ? 'b' : s === 3 ? 'e' : 'u') + '">' + s + '</td>'; }).join('') + '<td><b>' + t + '</b></td><td>' + relStr(t - 27) + '</td></tr>'; }).join('') + '</table>';
  var win = G.np > 1 ? G.players.slice().sort(function (a, b) { return a.scores.reduce(function (x, y) { return x + y; }, 0) - b.scores.reduce(function (x, y) { return x + y; }, 0); })[0] : null;
  $('oBig').textContent = win ? win.name + ' WINS' : tot <= SAVE.best ? 'BEST ROUND ' + tot : 'ROUND ' + tot;
  $('oRes').innerHTML = rows + '<div class="hint">' + (G.np === 1 ? 'best ' + SAVE.best + ' · aces ' + SAVE.aces : 'lowest total wins') + '</div>';
  G.state = 'over'; $('sTitle').hidden = $('sPause').hidden = true; $('sOver').hidden = false; $('menu').hidden = false; focusFirst();
}

/* ── camera ── */
var CAMP = { x: 0, y: 0, z: 0, tx: 0, ty: 0, tz: 0 };
function snapCam(p) { var v = camWant(p, true); CAMP.x = v[0]; CAMP.y = v[1]; CAMP.z = v[2]; CAMP.tx = v[3]; CAMP.ty = v[4]; CAMP.tz = v[5]; }
function camWant(p, aiming) {
  var a = G.aim, ox = Math.sin(a), oz = Math.cos(a), d = distToPin(p);
  if (G.camMode === 1 && aiming) { return [p.x - ox * 18, p.y + 22, p.z - oz * 18, p.x + ox * d * 0.5, 0, p.z + oz * d * 0.5]; }   // high view
  if (p.inAir || p.rolling) { var back = p.inAir ? 9 : 6; var vx = p.vx, vz = p.vz, hs = Math.hypot(vx, vz) || 1; return [p.x - (vx / hs) * back, p.y + (p.inAir ? 5 : 3), p.z - (vz / hs) * back, p.x, p.y + 0.5, p.z]; }
  var back = p.lie === 'green' ? 3.2 : 7.5, up = p.lie === 'green' ? 1.6 : 3.4;

}
function updateCam(dt) {
  var p = G.players[G.cur], v = camWant(p, G.phase === 'aim' || G.phase === 'swing'), k = Math.min(1, dt * (p.inAir ? 3.5 : 5));
  CAMP.x = lerp(CAMP.x, v[0], k); CAMP.y = lerp(CAMP.y, v[1], k); CAMP.z = lerp(CAMP.z, v[2], k); CAMP.tx = lerp(CAMP.tx, v[3], k); CAMP.ty = lerp(CAMP.ty, v[4], k); CAMP.tz = lerp(CAMP.tz, v[5], k);
  cam.position.set(CAMP.x, Math.max(CAMP.y, groundY(CAMP.x, CAMP.z) + 1.2), CAMP.z); cam.lookAt(CAMP.tx, CAMP.ty, CAMP.tz);
}

/* ── input ── */
function padRead(i) { var list = window.ArcadePad ? ArcadePad.pads() : [], gp = list[i]; return gp ? ArcadePad.read(gp) : null; }
function pollInputs(dt) {
  var p = G.players[G.cur], aim = 0, clubD = 0, press = false;
  if (window.__hpInput) { var o = window.__hpInput(G); aim = o.aim || 0; press = !!o.press; }
  else {
    aim = (KEY.ArrowRight || KEY.KeyD ? 1 : 0) - (KEY.ArrowLeft || KEY.KeyA ? 1 : 0);
    var r = padRead(G.np > 1 ? Math.min(G.cur, 1) : 0) || padRead(0); if (r && Math.abs(r.lx) > 0.12) aim = r.lx;
    if (TOUCH && TCH.active) aim = TCH.aim || aim;
  }
  if ((G.phase === 'aim' || G.phase === 'swing') && aim) G.aim += aim * (p.lie === 'green' ? 0.35 : 0.5) * dt;
}
function pressEdge() { var p = G.players[G.cur]; if (!p) return; swingPress(); }
function clubChange(d) { var p = G.players[G.cur]; if (G.phase !== 'aim') return; p.club = clamp(p.club + d, 0, 7); if (p.lie === 'green') p.club = 7; sfx('tick'); }
window.addEventListener('keydown', function (e) { var c = e.code || e.key; if (/^(Arrow|Space|Tab$|Backspace)/.test(c) || ($('menu').hidden && /^(Key|Enter)/.test(c))) e.preventDefault(); onKey(c, e.repeat); });
window.addEventListener('keyup', function (e) { KEY[e.code || e.key] = false; });
window.addEventListener('message', function (e) { var d = e.data || {}; if (e.source !== window.parent || d.arcade !== 'key') return; var c = d.code || d.key; if (d.type === 'keydown') onKey(c, !!d.repeat); else KEY[c] = false; });
function onKey(c, repeat) {
  audio(); KEY[c] = true; if (repeat) return;
  if (c === 'KeyM') { setSound(!SET.sound); return; }
  if (!$('menu').hidden) { menuKey(c); return; }
  if (!G) return;
  if (c === 'KeyP' || c === 'Escape') { pause(); return; }
  if (c === 'KeyC') { G.camMode = (G.camMode + 1) % 2; SET.cam = G.camMode; saveSet(); return; }
  if (c === 'Space' || c === 'Enter' || c === 'NumpadEnter') pressEdge();
  else if (c === 'ArrowUp' || c === 'KeyW') clubChange(-1); else if (c === 'ArrowDown' || c === 'KeyS') clubChange(1);
}
function pause() { if (!G || G.state !== 'play') return; G.state = 'pause'; KEY = {}; $('pRes').innerHTML = '<div class="hint">' + G.players.map(function (p) { return p.name + ' ' + relStr(totalRel(p)); }).join(' · ') + '</div>'; $('sTitle').hidden = $('sOver').hidden = true; $('sPause').hidden = false; $('menu').hidden = false; focusFirst(); }
function resume() { if (!G) return; G.state = 'play'; $('menu').hidden = true; }
function items() { return [].slice.call(document.querySelectorAll('#menu .scr:not([hidden]) button')).filter(function (b) { return !b.hidden; }); }
function focusFirst() { var it = items(); it.forEach(function (b) { b.classList.remove('sel'); }); if (it[0]) it[0].classList.add('sel'); }
function menuKey(c) {
  var it = items(), cur = document.querySelector('#menu .sel'), i = Math.max(0, it.indexOf(cur));
  if (c === 'ArrowDown' || c === 'KeyS') { it[i].classList.remove('sel'); it[(i + 1) % it.length].classList.add('sel'); sfx('tick'); }
  else if (c === 'ArrowUp' || c === 'KeyW') { it[i].classList.remove('sel'); it[(i - 1 + it.length) % it.length].classList.add('sel'); sfx('tick'); }
  else if (c === 'Enter' || c === 'Space' || c === 'NumpadEnter') { (cur || it[0]).click(); }
  else if (c === 'Escape' || c === 'Backspace') { if (!$('sPause').hidden) resume(); }
}
document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('#menu button'); if (!b) return; audio(); go(b.dataset.go); });
var LASTNP = 1;
function go(what) {
  sfx('tick');
  if (/^p[1-4]$/.test(what)) { LASTNP = +what[1]; newGame(LASTNP); }
  else if (what === 'again') newGame(LASTNP);
  else if (what === 'resume') resume();
  else if (what === 'title') { endGame(); showTitle(); }
  else if (what === 'exit') post('exit');
}
function showTitle() { $('sTitle').hidden = false; $('sOver').hidden = $('sPause').hidden = true; $('menu').hidden = false; $('mExit').hidden = !EMBED; $('best').textContent = (SAVE.best ? 'BEST ROUND ' + SAVE.best + ' (' + relStr(SAVE.best - 27) + ')' : 'NO ROUND YET') + ' · ACES ' + SAVE.aces; $('hint').textContent = TOUCH ? 'Drag to aim. Tap SWING to start the meter, tap for power, tap again for accuracy. CLUB changes the club.' : '← → aim · ↑ ↓ club · SPACE three times: start, power, accuracy · C camera · P pause · M mute · controller: stick, (A), d-pad'; focusFirst(); }
function pollPads() {
  for (var i = 0; i < 2; i++) { var r = padRead(i); if (!r) continue; var prev = PADPREV[i] || {}, now = { up: r.up || r.ly < -0.5, down: r.down || r.ly > 0.5, a: r.a, b: r.b, start: r.start, y: r.y, x: r.x }; function edge(k) { return now[k] && !prev[k]; }
    if (r.any) audio();
    if (!$('menu').hidden) { if (edge('up')) menuKey('ArrowUp'); if (edge('down')) menuKey('ArrowDown'); if (edge('a') || edge('start')) menuKey('Enter'); if (edge('b')) menuKey('Escape'); }
    else if (G) { if (edge('start')) pause(); if (edge('a')) pressEdge(); if (edge('up')) clubChange(-1); if (edge('down')) clubChange(1); if (edge('y')) { G.camMode = (G.camMode + 1) % 2; } }
    PADPREV[i] = now; }
}
(function touch() {
  var zone = $('tAim'), knob = $('tKnob'), sid = null, ox = 0;
  zone.addEventListener('pointerdown', function (e) { audio(); sid = e.pointerId; ox = e.clientX; TCH.active = true; zone.setPointerCapture(sid); e.preventDefault(); });
  zone.addEventListener('pointermove', function (e) { if (e.pointerId !== sid) return; var dx = clamp((e.clientX - ox) / 55, -1, 1); TCH.aim = dx; knob.style.transform = 'translateX(' + (dx * 46) + 'px)'; });
  function up(e) { if (e.pointerId !== sid) return; sid = null; TCH.aim = 0; knob.style.transform = ''; }
  zone.addEventListener('pointerup', up); zone.addEventListener('pointercancel', up);
  $('tSwing').addEventListener('pointerdown', function (e) { audio(); TCH.active = true; e.preventDefault(); if (G && $('menu').hidden) pressEdge(); });
  $('tClub').addEventListener('pointerdown', function (e) { audio(); e.preventDefault(); if (G) clubChange(1 - (G.players[G.cur].club === 7 ? 8 : 0)); });
  window.addEventListener('touchstart', function () { TCH.active = true; }, { passive: true });
})();
$('pauseBtn').addEventListener('click', function () { audio(); pause(); });
$('camBtn').addEventListener('click', function () { audio(); if (G) { G.camMode = (G.camMode + 1) % 2; SET.cam = G.camMode; saveSet(); } });
window.addEventListener('blur', function () { KEY = {}; pause(); });
document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });

/* ── frame ── */
function update(dt) {
  if (!G) return;
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('msg').classList.remove('on'); }
  if (G.state === 'ready') { G.readyT -= dt; if (G.readyT <= 0) G.state = 'play'; return; }
  if (G.state !== 'play') return;
  G.t += dt; var p = G.players[G.cur];
  pollInputs(dt);
  if (G.phase === 'swing' && G.swing) {
    var S = G.swing; S.t += dt;
    if (S.pow === 0) { S.v = Math.min(1, S.v + dt * 0.9); if (S.v >= 1) { S.v = 1; S.pow = 1; S.up = false; $('meter').querySelector('em').style.display = 'block'; $('meter').querySelector('em').style.left = '100%'; } }
    else { S.v -= dt * 1.25; if (S.v < -0.3) { strike(p, S.pow, -0.3); } }
  }
  if (G.phase === 'fly') { G.shotT += dt; for (var k = 0; k < 4; k++) stepBall(p, dt / 4); if (!p.inAir && !p.rolling && G.phase === 'fly') { settle(p, surfaceAt(p.x, p.z)); } }
  if (G.phase === 'settle') { G.settleT -= dt; if (G.settleT <= 0) nextTurn(); }
  // HUD
  var dp = distToPin(p), onG = p.lie === 'green';
  $('distT').textContent = Math.round(dp * YD) + (onG ? ' yds' : ' yds'); $('windT').textContent = Math.round(Math.hypot(G.wind[0], G.wind[1])); $('wind').style.transform = 'rotate(' + (Math.atan2(G.wind[0], -G.wind[1]) * 57.3 + 90 - G.aim * 57.3) + 'deg)';
  var club = CLUBS[p.club]; $('clubT').textContent = club.n; $('club').lastChild.textContent = (onG ? 'PUTT · POWER = DISTANCE' : Math.round(club.d * YD) + ' YDS · ↑↓ CHANGE');
  $('whoT').textContent = p.name; $('whoS').textContent = 'STROKE ' + (p.strokes + 1) + ' · ' + relStr(totalRel(p)) + (p.lie !== 'tee' ? ' · ' + p.lie.toUpperCase() : '');
  var M = $('meter'); if (G.swing) { M.querySelector('i').style.width = Math.max(0, G.swing.v * 100) + '%'; M.querySelector('u').style.left = Math.max(0, Math.min(100, G.swing.v * 100)) + '%'; } else { M.querySelector('i').style.width = '0%'; M.querySelector('u').style.left = '0%'; M.querySelector('em').style.display = 'none'; }
  $('mhint').textContent = G.phase === 'aim' ? (TOUCH ? 'TAP SWING TO START' : 'SPACE · START THE SWING') : G.phase === 'swing' ? (G.swing && G.swing.pow === 0 ? 'POWER · press again' : 'ACCURACY · press at the start') : '';
  // aim line
  if (G.phase === 'aim' || G.phase === 'swing') { var L = Math.min(dp, onG ? 8 : CLUBS[p.club].d * 0.45); aimLine.visible = true; aimLine.geometry.setFromPoints([new THREE.Vector3(p.x, p.y + 0.05, p.z), new THREE.Vector3(p.x + Math.sin(G.aim) * L, groundY(p.x + Math.sin(G.aim) * L, p.z + Math.cos(G.aim) * L) + 0.05, p.z + Math.cos(G.aim) * L)]); aimLine.computeLineDistances(); } else aimLine.visible = false;
  if (HG && HG.flag) HG.flag.rotation.y = Math.sin(G.t * 2.2) * 0.25 + Math.atan2(G.wind[0], G.wind[1]);
  updateCam(dt);
}
var last = performance.now();
function frame(now) { requestAnimationFrame(frame); var dt = Math.min(0.05, (now - last) / 1000); last = now; pollPads(); update(dt); draw(now); }
function draw(now) {
  var Wd = window.innerWidth, Hh = window.innerHeight; if (renderer.domElement.width !== Math.floor(Wd * renderer.getPixelRatio())) renderer.setSize(Wd, Hh, false);
  cam.aspect = Wd / Hh; cam.updateProjectionMatrix();
  if (!G) { var a = now / 12000; cam.position.set(Math.sin(a) * 30, 14, 40 + Math.cos(a) * 20); cam.lookAt(0, 0, 70); }
  if (W.water) W.water.position.x = cam.position.x, W.water.position.z = cam.position.z;
  renderer.render(scene, cam);
}
window.addEventListener('resize', function () { renderer.setSize(window.innerWidth, window.innerHeight, false); });
renderer.setSize(window.innerWidth, window.innerHeight, false);
buildHole(HOLES[0]); showTitle(); requestAnimationFrame(frame);
var artN = 0; ['grass', 'green', 'sand', 'timber', 'brick'].forEach(function (k) { loadArt(k, 1024, function () { if (++artN === 5 && !G) buildHole(HOLES[0]); }); });
window.__hp = { get G() { return G; }, newGame: newGame, step: function (sec) { for (var i = 0; i < Math.round(sec * 60); i++) update(1 / 60); }, strike: strike, press: swingPress, save: function () { return SAVE; }, build: BUILD, HOLES: HOLES, surfaceAt: function (x, z) { return surfaceAt(x, z); }, heightAt: function (x, z) { return heightAt(x, z); }, render: function () { draw(performance.now()); }, play: function () { if (G) G.state = 'play'; } };
})();
</script>
