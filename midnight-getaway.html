<!-- YESTERDAYLAND: Midnight Getaway — ContentPad Arcade (build 2026102801-gw)
     An original top-down getaway driver. It's 1986. You're the wheel for a crew working the YESTERDAYLAND grid:
     pick them up, get them to the safehouse, and keep the heat off. Every job pays more and brings more cruisers.
     Drift with the e-brake (it refills the nitro), slipstream traffic, smash the street furniture, ram cruisers
     for takedowns, lose the police to cool the heat. One night, one car, as many jobs as you can run before you're
     wrecked or busted. Original characters and invented businesses only. Everything is drawn and sounded in the game.
     Posts {arcade:'start'|'over'}; save in localStorage (gw_save), cloud via account.js. -->
<title>YESTERDAYLAND: Midnight Getaway · ContentPad Arcade</title>

/* ── settings + save ── */

/* ── audio: all synthesised ── */

  else if (n === 'big') { [523, 659, 784, 1047, 1318].forEach(function (f, i) { setTimeout(function () { tone(f, 0.22, 'square', 0.09); }, i * 100); }); }

  else if (n === 'pickup') { [392, 523, 659].forEach(function (f, i) { setTimeout(function () { tone(f, 0.16, 'square', 0.09); }, i * 110); }); }

  else if (n === 'over') { tone(500, 1.2, 'sawtooth', 0.14, 50); }
  else if (n === 'start') { [392, 523, 659, 784].forEach(function (f, i) { setTimeout(function () { tone(f, 0.16, 'square', 0.09); }, i * 120); }); }

}
function setSound(on) { SET.sound = on; ls('gw_settings', JSON.stringify(SET)); if (master) master.gain.setTargetAtTime(on ? 0.7 : 0, AC.currentTime, 0.05); document.getElementById('mute').textContent = on ? '♪' : '✕'; }
document.getElementById('mute').textContent = SET.sound ? '♪' : '✕';
document.getElementById('mute').addEventListener('click', function () { audio(); setSound(!SET.sound); });

/* ── the city: a grid of blocks with a street between each ── */
var N = 11, P = 210, RW = 66, BW = P - RW, WORLD = N * P + RW, LANE = 17;
var DIST = [['Sunset', '#1c1830', '#ff9a3c'], ['Midtown', '#161a28', '#7fb2ff'], ['The Strip', '#201a16', '#ffd84a'], ['Ocean Drive', '#14202a', '#9be7c4']];
var SIGNS = ['MOTEL', 'DINER', 'RECORDS', 'ARCADE', 'LIQUOR', 'PAWN', 'TACOS', 'VIDEO', 'LOUNGE', 'DONUTS', 'CLEANERS', 'JEWELERS', 'CHOP SUEY', 'NAILS', 'BAIL BONDS', 'TIRES', 'COFFEE', 'PIZZA', 'OPEN 24 HRS', 'VACANCY', 'KARAOKE', 'SUBS', 'SLOTS', 'WEDDINGS', 'HOTEL', 'BBQ', 'SURF', 'BOOKS', 'FLORIST', 'ROOMS'];
var BLOCKS = [], PROPS = [], LAMPS = [];
function districtOf(i, j) { return (i < N / 2 ? 0 : 1) + (j < N / 2 ? 0 : 2); }
function buildCity() {
  BLOCKS = []; PROPS = []; LAMPS = [];
  for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
    var x = RW + i * P, y = RW + j * P, d = districtOf(i, j), lot = Math.random() < 0.07;
    var bl = { x: x, y: y, w: BW, h: BW, d: d, lot: lot, bits: [], sign: null };
    if (!lot) {
      // a few buildings per block, shoulder to shoulder, each with its own roof shade and window grid
      var n = 2 + Math.floor(Math.random() * 3), tint = DIST[d][1];
      for (var k = 0; k < n; k++) {
        var fx = x + (k / n) * BW, fw = BW / n; bl.bits.push({ x: fx, y: y, w: fw, h: BW, sh: rnd(0.75, 1.15), win: Math.random() < 0.85, tint: tint });
      }
      var side = Math.floor(Math.random() * 4); bl.sign = { t: pick(SIGNS), side: side, c: pick(['#ff5f9e', '#ffae5c', '#9be7c4', '#7fb2ff', '#ffd84a', '#ff7a1a']), on: Math.random() < 0.9 };
    }
    BLOCKS.push(bl);
    // street furniture on the sidewalk strip (the first 10 px of the block edge)
    var np = lot ? 3 : 2 + Math.floor(Math.random() * 3);
    for (var q = 0; q < np; q++) {
      var s = Math.floor(Math.random() * 4), t = Math.random(), px, py;
      if (s === 0) { px = x + t * BW; py = y + 6; } else if (s === 1) { px = x + t * BW; py = y + BW - 6; } else if (s === 2) { px = x + 6; py = y + t * BW; } else { px = x + BW - 6; py = y + t * BW; }

    }

}
function blockAt(x, y) { var i = Math.floor((x - RW) / P), j = Math.floor((y - RW) / P); if (i < 0 || j < 0 || i >= N || j >= N) return null; var b = BLOCKS[i * N + j]; return (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) ? b : null; }
// push a circle out of the buildings and the world edge; returns [nx, ny, depth] of the deepest contact or null
function solidPush(x, y, r) {
  var best = null;
  function hit(nx, ny, d) { if (!best || d > best[2]) best = [nx, ny, d]; }
  if (x < RW / 2 + r) hit(1, 0, RW / 2 + r - x); if (x > WORLD - RW / 2 - r) hit(-1, 0, x - (WORLD - RW / 2 - r));

/* ── cars ── */
function newCar(kind, x, y, th) {

    : kind === 'traffic' ? { top: rnd(70, 110), acc: 120, grip: 9, turn: 3, L: 30, W: 15, col: pick(['#6e1424', '#24407a', '#cdb48a', '#2f4a3a', '#8a8a90', '#e9e4d8', '#7a5a2a', '#ffd84a', '#5a6a7a']), hp: 99 }

}

/* ── traffic: cars that follow the lanes and turn at corners ── */
