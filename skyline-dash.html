<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Maverick: Skyline Dash · ContentPad Arcade</title>
<meta name="description" content="Skate the rooftops with Maverick. Ollie the gaps, grind the rails, grab the gold. Five levels. An original ContentPad Arcade game.">
<meta name="theme-color" content="#120a1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0712;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

</style>
</head>
<body>
<canvas id="c" aria-label="Maverick: Skyline Dash, a rooftop skateboarding game. Press space or tap to ollie."></canvas>
<div id="hud">
  <button class="btn" id="pause" type="button" aria-label="Pause">❚❚</button>
  <button class="btn" id="mute" type="button" aria-label="Mute">♪</button>
</div>
<script>
/* Maverick: Skyline Dash — ContentPad Arcade house game #1 (build 2026100306-skate).
   v2: rooftop SKATEBOARDING with grind rails and five levels. Original game and character
   (Maverick, owned by ContentPad). Art and music made in ContentPad Studio; code written with Claude.
   Controls: Space / ↑ / W / tap / click / controller A = ollie (hold for height); press again in the

   Talks to the Arcade page with postMessage {arcade:'start'|'over'}. */
(function () {

  var ASSETS = window.SKYLINE_ASSETS || {
    ride: CDN + '7e15bf18-c18d-465c-8d5f-27bef64e31e4.png', push: CDN + 'c804b166-0c7d-45d6-8e29-ca43d257fe19.png', ollie: CDN + 'd1094dc6-3ec4-4b25-85db-f4d8dc03fc79.png', flip: CDN + '8796bd8f-9092-43ad-9025-d3e185279711.png',
    grind: CDN + '48c612a7-f098-481a-ba6f-f46126cff639.png', bail: CDN + '06e4ec87-5ecc-4a0e-a1c1-59289ce34b9f.png', cover: CDN + '6402676d-dc77-4014-9ccd-39cd14f81267.png',
    bg1: CDN + 'a92f6293-0b58-41a5-9798-8ad2ac8370d8.png', bg2: CDN + '2c2d4e5c-caad-47c1-aee8-7bfc2b9782d3.png', bg3: CDN + '101f24a1-6226-47f1-80bf-19ca9e66bd1c.png', bg4: CDN + 'a336aa68-3e61-4c08-baaf-e0a2c0015fce.png', bg5: CDN + 'b4d8c9ea-66b4-4d5f-9daa-c551c0c72ef6.png',

  };

  var VIA = 'https://link.contentpad.io/dl?u=';

        var r = p[i], gr = p[i + 1], b = p[i + 2], m = r > b ? r : b, dom = gr - m;
        if (dom > 60) p[i + 3] = 0;

        else if (dom > 0) p[i + 1] = m + (dom >> 1);

    } catch (e) {}

  }
  function trim(c) {
    var g = c.getContext('2d'), w = c.width, h = c.height, d;
    try { d = g.getImageData(0, 0, w, h).data; } catch (e) { return c; }
    var x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (var y = 0; y < h; y += 2) for (var x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 <= x0 || y1 <= y0) return c;
    var o = document.createElement('canvas'); o.width = x1 - x0 + 2; o.height = y1 - y0 + 2;

  }
  Object.keys(ASSETS).forEach(function (k) {
    if (k === 'music' || !ASSETS[k]) return;

    if (KEYED[k]) im.crossOrigin = 'anonymous';
    im.onload = function () { var c = KEYED[k] ? keyGreen(im) : im; if (CROP[k] && c.getContext) { var o = document.createElement('canvas'); o.width = c.width; o.height = Math.round(c.height * CROP[k]); o.getContext('2d').drawImage(c, 0, 0); c = o; } IMG[k] = c; loaded++; };
    im.onerror = function () { loaded++; };
    im.src = (KEYED[k] && !window.SKYLINE_ASSETS && ASSETS[k].indexOf(CDN) === 0) ? VIA + encodeURIComponent(ASSETS[k]) : ASSETS[k];
  });

  // ── audio ────────────────────────────────────────────────────────────────
  var muted = false, actx = null, music = null;
  try { muted = localStorage.getItem('arcade_muted') === '1'; } catch (e) {}

    syncMusic();
  }
  function syncMusic() { if (!music) return; if (muted || state !== 'play' || paused) music.pause(); else { var p = music.play(); if (p && p.catch) p.catch(function () {}); } }
  function blip(f0, f1, dur, type, vol) {

    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;

  }
  var grindNode = null;
  function grindSound(on) {
    if (muted || !actx) on = false;
    if (on && !grindNode) {
      try {
        var len = actx.sampleRate * 0.5, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.6;
        var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
        var bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 3;
        var g = actx.createGain(); g.gain.value = 0.05;
        src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start();
        grindNode = { src: src, g: g };
      } catch (e) {}
    } else if (!on && grindNode) { try { grindNode.src.stop(); } catch (e) {} grindNode = null; }
  }
  var sfx = {
    ollie: function () { blip(180, 90, 0.08, 'square', 0.07); blip(420, 760, 0.12, 'triangle', 0.05); },
    flip: function () { blip(600, 1300, 0.18, 'square', 0.05); },
    coin: function () { blip(988, 1318, 0.09, 'triangle', 0.09); setTimeout(function () { blip(1318, 1760, 0.12, 'triangle', 0.08); }, 60); },
    bail: function () { blip(220, 50, 0.45, 'sawtooth', 0.12); },
    land: function () { blip(130, 60, 0.07, 'sine', 0.09); },
    rail: function () { blip(1800, 900, 0.06, 'square', 0.04); },
    win: function () { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { blip(f, f * 1.01, 0.2, 'triangle', 0.08); }, i * 120); }); },
    check: function () { blip(660, 990, 0.15, 'triangle', 0.07); }
  };

  // ── levels ───────────────────────────────────────────────────────────────
  var LEVELS = [
    { n: 'SUNSET ROOFTOPS', sub: 'Learn the lines', bg: 'bg1', len: 22000, s0: 360, s1: 460, gap: [70, 150], rail: 0.42, gapRail: 0.12, down: 0.08, obs: 0.30, kinds: ['vent', 'vent', 'drone'], tint: 'rgba(255,120,170,.06)' },
    { n: 'NEON NIGHT', sub: 'Grind the glow', bg: 'bg2', len: 27000, s0: 390, s1: 520, gap: [90, 190], rail: 0.48, gapRail: 0.2, down: 0.14, obs: 0.36, kinds: ['vent', 'drone', 'drone'], tint: 'rgba(60,40,160,.16)' },
    { n: 'RAIN CHECK', sub: 'Waterproof boots. No excuses.', bg: 'bg3', len: 31000, s0: 410, s1: 560, gap: [100, 210], rail: 0.5, gapRail: 0.24, down: 0.16, obs: 0.4, kinds: ['vent', 'drone', 'cloud'], rain: 1, tint: 'rgba(30,70,110,.2)' },
    { n: 'SUNRISE BRIDGES', sub: 'Long gaps, longer rails', bg: 'bg4', len: 35000, s0: 430, s1: 600, gap: [130, 250], rail: 0.46, gapRail: 0.34, down: 0.2, obs: 0.4, kinds: ['vent', 'drone', 'cloud'], tint: 'rgba(255,170,140,.08)' },
    { n: 'STORM TOWER', sub: 'Everything at once', bg: 'bg5', len: 40000, s0: 460, s1: 660, gap: [140, 260], rail: 0.5, gapRail: 0.32, down: 0.22, obs: 0.48, kinds: ['vent', 'drone', 'cloud', 'cloud'], storm: 1, tint: 'rgba(80,20,120,.2)' }
  ];
  var SAVE = { levels: {} };
  try { SAVE = JSON.parse(localStorage.getItem('skyline_levels') || '') || SAVE; } catch (e) {}
  if (!SAVE.levels) SAVE.levels = {};
  function unlocked(i) { return i === 0 || !!SAVE.levels[i]; }   // level i unlocks once level i-1 is cleared
  function totalBest() { var t = 0; for (var k in SAVE.levels) t += SAVE.levels[k].score || 0; return t; }
  function saveProgress() {
    try { localStorage.setItem('skyline_levels', JSON.stringify(SAVE)); localStorage.setItem('skyline_best', String(totalBest())); } catch (e) {}
  }

  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ── world ────────────────────────────────────────────────────────────────
  var GRAV = 2600, JUMP_V = -900, FLIP_V = -620, CUT = 0.45;
  var state = 'title', paused = false, last = 0, sel = 0, LV = null, lvIdx = 0;
  var speed, dist, coins, coinTotal, score, shake, flash, lives, bails, tricks, combo, comboT, popups, checkpoint, finishX, endT, stars, lightning;
  var roofs = [], rails = [], obs = [], tokens = [], flags = [], parts = [], rain = [];
  popups = [];
  var P;

  function build(i) {
    LV = LEVELS[i]; lvIdx = i;
    var R = rng(1000 + i * 77), r = function (a, b) { return a + R() * (b - a); };
    roofs = []; rails = []; obs = []; tokens = []; flags = []; parts = []; popups = [];
    var x = -60, y = 430, prev = { x: x, w: 1300, y: y }; roofs.push(prev); x = prev.x + prev.w;
    var cps = [LV.len / 3, LV.len * 2 / 3], cpi = 0;
    while (x < LV.len) {
      var p = Math.min(1, x / LV.len);
      var gap = r(LV.gap[0], LV.gap[0] + (LV.gap[1] - LV.gap[0]) * (0.5 + p * 0.5));
      var w = r(520, 920 - p * 120);
      var ny = Math.max(320, Math.min(460, prev.y + r(-80, 80)));
      var roll = R(), roof = null;
      if (roll < LV.gapRail) {
        // a rail bridging a wide gap — grind it to get across
        gap = r(260, 380 + p * 80); ny = Math.max(330, Math.min(450, prev.y + r(-40, 40)));
        roof = { x: x + gap, w: w, y: ny }; roofs.push(roof);
        var ry = Math.min(prev.y, ny) - r(66, 84), rx0 = x - r(140, 220), rx1 = roof.x + r(120, 200);
        rails.push({ x0: rx0, x1: rx1, y0: ry, y1: ry, kind: 'bridge' });
        coinRow(rx0 + 40, rx1 - 30, function (cx_) { return ry - 34; }, 60);
        coinArc(rx0 - 170, ry - 20, 3, 70);
      } else if (roll < LV.gapRail + LV.down && prev.y < 420) {
        // a down-rail from the high roof to a lower one
        ny = Math.min(470, prev.y + r(80, 120)); gap = r(140, 220);
        roof = { x: x + gap, w: w, y: ny }; roofs.push(roof);
        var d0 = x - r(220, 300), d1 = roof.x + r(140, 220), dy0 = prev.y - 62, dy1 = ny - 46;
        rails.push({ x0: d0, x1: d1, y0: dy0, y1: dy1, kind: 'down' });
        coinRow(d0 + 40, d1 - 30, function (cx_) { return railY({ x0: d0, x1: d1, y0: dy0, y1: dy1 }, cx_) - 34; }, 64);
      } else {
        roof = { x: x + gap, w: w, y: ny }; roofs.push(roof);
      }
      // dress the new roof
      var fx = roof.x + r(250, 320), end = roof.x + roof.w - 140;   // room to land before anything
      if (cpi < 2 && roof.x > cps[cpi]) { flags.push({ x: roof.x + 60, y: roof.y, cp: true, got: false }); cpi++; fx += 120; }
      while (fx < end) {
        var q = R();
        if (q < LV.rail && end - fx > 240) {
          var lw = r(200, Math.min(560, end - fx)), lh = r(52, 74);
          rails.push({ x0: fx, x1: fx + lw, y0: roof.y - lh, y1: roof.y - lh, kind: 'ledge', base: roof.y });
          coinRow(fx + 30, fx + lw - 20, function () { return roof.y - lh - 34; }, 58);
          fx += lw + r(160, 240);
        } else if (q < LV.rail + LV.obs * 0.8) {
          var kind = LV.kinds[Math.floor(R() * LV.kinds.length)];
          if (kind !== 'vent' && fx > end - 260) kind = 'vent';   // nothing overhead right before a gap you must ollie
          if (kind === 'vent') obs.push({ k: 'vent', x: fx, y: roof.y - 64, w: 70, h: 64 });
          else if (kind === 'drone') obs.push({ k: 'drone', x: fx, y: roof.y - r(150, 172), w: 74, h: 50, bob: r(0, 6) });
          else obs.push({ k: 'cloud', x: fx, y: roof.y - r(250, 285), w: 92, h: 66, bob: r(0, 6), zap: 1 });

  function coinRow(a, b, yf, step) { for (var cxp = a; cxp <= b; cxp += step) tokens.push({ x: cxp, y: yf(cxp), r: 14, got: false, s: Math.random() * 6 }); }

  function startLevel(i) {

  // ── input ────────────────────────────────────────────────────────────────

    if (P.ground) { P.vy = JUMP_V; P.ground = false; P.jumps = 1; P.holding = true; sfx.ollie(); dust(wx(P.x + 20), P.y + P.h, 8); }

  function firstOpen() { for (var i = LEVELS.length - 1; i >= 0; i--) if (unlocked(i) && !SAVE.levels[i + 1]) return i; return 0; }
  function afterEnd(a) {

    else { if (a === 'A') startLevel(lvIdx); else { state = 'select'; sel = lvIdx; } }

    txt('PICK A LEVEL', W / 2, 54, 34, '#fff');
    var n = LEVELS.length, gap = 14, cw = Math.min(170, (W - 40 - gap * (n - 1)) / n), ch = cw * 1.45, x0 = (W - (cw * n + gap * (n - 1))) / 2, y0 = H / 2 - ch / 2 + 6;
    cards = [];
    for (var i = 0; i < n; i++) {
      var L = LEVELS[i], x = x0 + i * (cw + gap), open = unlocked(i), sv = SAVE.levels[i + 1], on = i === sel, y = y0 - (on ? 10 : 0);
      cards.push({ x: x, y: y, w: cw, h: ch });
      cx.save();
      cx.beginPath(); roundRect(x, y, cw, ch, 14); cx.clip();
      var im = IMG[L.bg]; if (im) { var s2 = ch / im.naturalHeight; cx.drawImage(im, x - (im.naturalWidth * s2 - cw) * 0.35, y, im.naturalWidth * s2, ch); } else { cx.fillStyle = '#2a1640'; cx.fillRect(x, y, cw, ch); }
      var gr = cx.createLinearGradient(0, y, 0, y + ch); gr.addColorStop(0, 'rgba(12,6,24,.1)'); gr.addColorStop(1, 'rgba(12,6,24,.92)'); cx.fillStyle = gr; cx.fillRect(x, y, cw, ch);
      if (!open) { cx.fillStyle = 'rgba(12,6,24,.65)'; cx.fillRect(x, y, cw, ch); }
      cx.restore();
      cx.lineWidth = on ? 4 : 2; cx.strokeStyle = on ? '#f5c542' : 'rgba(255,255,255,.25)'; cx.beginPath(); roundRect(x, y, cw, ch, 14); cx.stroke();
      txt(String(i + 1), x + 22, y + 26, 22, on ? '#f5c542' : '#fff');
      wrap(L.n, x + cw / 2, y + ch - 66, cw - 14, Math.max(11, Math.min(15, cw / 11)));
      if (!open) txt('🔒', x + cw / 2, y + ch / 2 - 20, 28, '#fff', 'center', false);
      else { var st = sv ? sv.stars : 0; txt('★★★'.slice(0, st) + '☆☆☆'.slice(0, 3 - st), x + cw / 2, y + ch - 30, 18, '#f5c542', 'center', false); if (sv) txt(String(sv.score), x + cw / 2, y + ch - 12, 11, '#e8dff5', 'center', false); }
    }
    var L2 = LEVELS[sel];
    txt(unlocked(sel) ? L2.sub : 'Clear level ' + sel + ' to unlock', W / 2, y0 + ch + 34, 16, '#e8dff5', 'center', false);
    txt(coarse() ? 'TAP A LEVEL, TAP AGAIN TO SKATE' : '← → CHOOSE · SPACE / (A) SKATE · ESC BACK', W / 2, H - 22, 13, 'rgba(255,255,255,' + (0.6 + 0.4 * Math.sin(now / 300)) + ')', 'center', false);
  }
  function wrap(s, x, y, maxW, size) {
    cx.font = size + 'px "Archivo Black",sans-serif'; var words = s.split(' '), lines = [], line = '';
    words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (cx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }); lines.push(line);
    lines.forEach(function (l, i) { txt(l, x, y + i * (size + 3) - (lines.length - 1) * (size + 3) / 2, size, '#fff'); });
  }
  function roundRect(x, y, w, h, r) { cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function drawHud(now) {
    txt(String(score), 24, 34, 30, '#fff', 'left');
    txt('◉ ' + coins + '/' + coinTotal, 26, 64, 15, '#f5c542', 'left');
    var hearts = ''; for (var i = 0; i < 3; i++) hearts += i < lives ? '♥' : '♡';
    txt(hearts, 26, 88, 18, '#ff4fb3', 'left', false);
    // progress
    var pw = Math.min(360, W * 0.36), px = W / 2 - pw / 2, py = 22, prog = Math.min(1, (dist + P.x) / finishX);
    txt('L' + (lvIdx + 1) + ' · ' + LV.n, W / 2, py - 2, 12, '#e8dff5', 'center', false);
    cx.fillStyle = 'rgba(255,255,255,.18)'; cx.fillRect(px, py + 10, pw, 6);
    cx.fillStyle = '#f5c542'; cx.fillRect(px, py + 10, pw * prog, 6);
    flags.forEach(function (f) { if (f.cp) { cx.fillStyle = f.got ? '#3ddc84' : '#fff'; cx.fillRect(px + pw * Math.min(1, f.x / finishX) - 1, py + 7, 3, 12); } });
    if (combo > 1 && comboT > 0) txt('x' + combo + ' COMBO', W - 130, 86, 18, '#7fd3ff', 'center');
    popups.forEach(function (p, i) { var a = Math.min(1, 1.6 - p.t * 1.4); cx.globalAlpha = Math.max(0, a); txt(p.s, P.x + 40, P.y - 30 - p.t * 50 - i * 4, 18, '#fff'); if (p.v) txt(p.v, P.x + 40, P.y - 8 - p.t * 50, 14, '#f5c542'); cx.globalAlpha = 1; });
    if (state === 'over' && now - endT > 350) {
      cx.fillStyle = 'rgba(12,6,24,.66)'; cx.fillRect(0, 0, W, H);
      txt('WIPEOUT', W / 2, H * 0.28, 56, '#ff4fb3');
      txt(LV.n, W / 2, H * 0.28 + 52, 18, '#e8dff5', 'center', false);
      txt(String(score), W / 2, H * 0.28 + 96, 40, '#fff');
      txt(coins + ' coins · ' + tricks + ' tricks · ' + Math.round(Math.min(1, (dist + P.x) / finishX) * 100) + '% of the level', W / 2, H * 0.28 + 136, 16, '#e8dff5', 'center', false);
      if (now - endT > 700) {
        txt(coarse() ? 'TAP TO TRY AGAIN' : 'SPACE / (A) TRY AGAIN', W / 2 + W / 4, H * 0.8, 18, 'rgba(255,255,255,' + (0.6 + 0.4 * Math.sin(now / 300)) + ')');
        txt(coarse() ? '◀ LEVELS (tap here)' : 'ESC / (B) LEVELS', W / 4, H * 0.8, 16, '#e8dff5');
      }
    }
    if (state === 'clear' && now - endT > 350) {
      cx.fillStyle = 'rgba(12,6,24,.66)'; cx.fillRect(0, 0, W, H);
      txt(lvIdx + 1 === LEVELS.length ? 'YOU BEAT THE SKYLINE' : 'LEVEL CLEAR', W / 2, H * 0.22, 48, '#f5c542');
      txt('★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars), W / 2, H * 0.22 + 62, 46, '#f5c542', 'center', false);
      txt(String(score) + (P.record ? '  NEW BEST' : ''), W / 2, H * 0.22 + 118, 34, '#fff');
      txt(coins + '/' + coinTotal + ' coins · ' + tricks + ' tricks · ' + (bails ? bails + ' bail' + (bails > 1 ? 's' : '') : 'no bails') + ' · ' + lives + ' ♥ left = +' + lives * 500, W / 2, H * 0.22 + 156, 15, '#e8dff5', 'center', false);
      txt('★ finish  ★★ 60% coins  ★★★ 90% coins + no bails', W / 2, H * 0.22 + 184, 12, '#bdb3d6', 'center', false);
      if (now - endT > 700) {
        txt(lvIdx + 1 < LEVELS.length ? (coarse() ? 'TAP FOR NEXT LEVEL' : 'SPACE / (A) NEXT LEVEL') : (coarse() ? 'TAP FOR LEVELS' : 'SPACE / (A) LEVELS'), W / 2 + W / 4, H * 0.82, 18, 'rgba(255,255,255,' + (0.6 + 0.4 * Math.sin(now / 300)) + ')');
        txt(coarse() ? '◀ LEVELS (tap here)' : 'ESC / (B) LEVELS', W / 4, H * 0.82, 16, '#e8dff5');
      }
    }
    if (paused) { cx.fillStyle = 'rgba(12,6,24,.6)'; cx.fillRect(0, 0, W, H); txt('PAUSED', W / 2, H / 2 - 10, 54, '#fff'); txt('tap or press P to keep skating · Esc twice for levels', W / 2, H / 2 + 40, 16, '#e8dff5', 'center', false); }
  }

  // ── controller ───────────────────────────────────────────────────────────
  var pad = {};
  function pollPad() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [], gp = null;
    for (var i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { gp = pads[i]; break; }
    if (!gp) return;
    var b = gp.buttons, down = function (n) { return !!(b[n] && b[n].pressed); };
    var now = { a: down(0) || down(2) || down(3) || down(12) || gp.axes[1] < -0.6, b: down(1), st: down(9), l: down(14) || gp.axes[0] < -0.6, r: down(15) || gp.axes[0] > 0.6 };
    if (now.a && !pad.a) press(); if (!now.a && pad.a) release();
    if (now.b && !pad.b) back();
    if (now.st && !pad.st) { if (state === 'play') togglePause(); else press(); }
    if (now.l && !pad.l) nav(-1); if (now.r && !pad.r) nav(1);
    pad = now;
  }

  // ── loop ─────────────────────────────────────────────────────────────────
  function frame(now) {
    pollPad();
    var dt = Math.min(0.033, (now - (last || now)) / 1000); last = now;
    if (!paused) { var reps = window.__skyTS || 1; for (var rp = 0; rp < reps; rp++) update(dt); }
    draw(now);
    requestAnimationFrame(frame);
  }
  // test hooks
  window.__skyline = {
    state: function () { return { state: state, score: score, coins: coins, coinTotal: coinTotal, lives: lives, dist: dist, finishX: finishX, level: lvIdx + 1, grind: !!(P && P.grind), ground: P && P.ground, y: P && P.y, paused: paused, loaded: loaded, needed: needed, sel: sel, save: SAVE, stars: stars, tricks: tricks }; },
    world: function () { return { roofs: roofs, rails: rails, obs: obs, tokens: tokens, P: P }; },
    press: press, release: release, nav: nav, back: back, start: startLevel, levels: LEVELS
  };
  requestAnimationFrame(frame);
})();
