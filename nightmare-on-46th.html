  #pad{position:fixed;inset:auto 0 0 0;height:0;display:none;z-index:4}

    setHp: function (s, hp) { P[s].hp = hp; }, meter: function (s, v) { P[s].meter = v; }, forceState: function (s) { state = s; endT = performance.now() - 5000; }
  };
