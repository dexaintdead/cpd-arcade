<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play · ContentPad Arcade</title>
<meta name="theme-color" content="#02030d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arcade.css?v=4">
<style>
/* full screen: the game fills the screen and gets an exit bar */
.stage:fullscreen{border:0;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;box-shadow:none}
.stage:-webkit-full-screen{border:0;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.fsbar{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:5;display:none;gap:8px;transition:opacity .4s}
.stage:fullscreen .fsbar,.stage:-webkit-full-screen .fsbar{display:flex}
.fsbar.dim{opacity:.28}.fsbar:hover{opacity:1}
.fsbar button,.fsbar a{font:800 13px Inter,system-ui,sans-serif;color:#fff;background:rgba(8,6,20,.72);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
.fsbar button:hover,.fsbar a:hover{border-color:#f5c542}
</style>
</head>
<body>
<div class="sky"></div><canvas id="dust"></canvas><div class="scan"></div>
<header class="bar"><div class="wrap">
  <a class="logo" href="./" aria-label="ContentPad Arcade home"><img src="https://contentpad.io/contentpad-logo-nav.png" alt="ContentPad"><span class="arc chrome">ARCADE</span></a>
  <nav class="nav" aria-label="Arcade"><a class="on" href="./">Games</a></nav>
  <span class="clock" id="clock" aria-hidden="true"></span>
</div></header>

<main class="wrap" id="main"></main>

<footer><div class="wrap">
  <span>© 2026 ContentPad Studios · Original games and characters. All rights reserved.</span>
  <span><a href="./">All games</a> · <a href="https://contentpad.io/">contentpad.io</a></span>
</div></footer>

<script src="games.js?v=7"></script>
<script src="arcade.js?v=3"></script>
<script src="account.js?v=2"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var slug = (new URLSearchParams(location.search).get('g') || '').replace(/[^a-z0-9-]/g, '');
  var g = (window.ARCADE_GAMES || []).filter(function (x) { return x.slug === slug && x.status === 'live'; })[0];
  var main = document.getElementById('main');
  if (!g) { main.innerHTML = '<section class="sec"><h2 class="disp chrome">Game not found</h2><p style="color:var(--dim)">That game isn\'t in the Arcade. <a href="./" style="color:var(--ice)">See all games</a>.</p></section>'; return; }
  document.title = g.title + ' · ContentPad Arcade';
  var bestKey = g.slug === 'skyline-dash' ? 'skyline_best' : 'arcade_best_' + g.slug;
  function best() { try { return +localStorage.getItem(bestKey) || 0; } catch (e) { return 0; } }
  var src = g.file || (encodeURIComponent(g.slug) + '.html');
  main.innerHTML =
    '<div class="play-wrap"><div>' +
      '<div class="stage" id="stage"><div class="fsbar" id="fsbar"><button type="button" id="fsExit">✕ Exit full screen</button><a href="./" id="fsHome">☰ All games</a></div><iframe id="game" title="' + esc(g.title) + '" allow="autoplay; fullscreen; gamepad" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe></div>' +
      '<div class="stagebar"><h1 class="disp chrome">' + esc(g.title) + '</h1>' +
        '<button class="btn ghost" id="fs" type="button">⛶ Full screen</button>' +
        '<button class="btn ghost" id="share" type="button">Share</button></div>' +
    '</div><aside class="side">' +
      '<div class="card score"><div><h4>' + esc(g.scoreLabel || 'Your best') + '</h4><span style="color:var(--dim);font-size:13px" id="bestWhere">saved on this device</span></div><b id="best">' + (best() || '—') + '</b></div>' +
      '<div class="card" id="lbCard" hidden><h4>Leaderboard</h4><div id="lb"></div></div>' +
      '<div class="card"><h4>About</h4><p>' + esc(g.about) + '</p></div>' +
      (g.controls ? '<div class="card"><h4>Controls</h4><div class="keys">' + g.controls.map(function (c) { return '<div><kbd>' + esc(c[0]) + '</kbd><span>' + esc(c[1]) + '</span></div>'; }).join('') + '</div></div>' : '') +
      '<div class="card"><h4>Credits</h4><p><b style="color:var(--tx)">' + esc(g.by) + '</b><br>' + esc(g.made || '') + '</p>' +
        '<div class="row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">' + (g.tags || []).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div></div>' +
    '</aside></div>';
  var frame = document.getElementById('game');
  var AC = window.ArcadeAccount, lb = null;
  function where() { var w = document.getElementById('bestWhere'); if (w) w.textContent = AC && AC.player ? 'synced to ' + AC.player.name : 'saved on this device'; document.getElementById('best').textContent = best() || '—'; }
  // Pull the cloud save into this device BEFORE the game reads it, then start the game.
  // Never waits more than 2.5 s: a slow network costs a sync, not the game.
  var started = false;
  function start() { if (started) return; started = true; where(); frame.src = src; }
  if (AC && AC.signedIn() && AC.sync) { setTimeout(start, 2500); Promise.resolve(AC.sync(g.slug)).then(start, start); } else start();
  if (AC) {
    AC.online().then(function (on) { if (!on) return; document.getElementById('lbCard').hidden = false; lb = AC.board(document.getElementById('lb'), g.slug, { picker: true, limit: 10 }); });
    AC.onChange(function () { where(); if (lb) lb.refresh(); });
    // Whatever happened since the last push goes up when the page is left.
    addEventListener('pagehide', function () { if (AC.signedIn()) AC.sync(g.slug, '', { keepalive: true }); });
  }
  frame.addEventListener('load', function () { try { frame.contentWindow.focus(); } catch (e) {} });
  document.getElementById('stage').addEventListener('pointerdown', function () { try { frame.contentWindow.focus(); } catch (e) {} });
  var stage = document.getElementById('stage');
  function focusGame() { try { if (document.activeElement && document.activeElement !== frame) document.activeElement.blur(); frame.focus(); frame.contentWindow.focus(); } catch (e) {} }
  document.getElementById('fs').addEventListener('click', function () {
    this.blur();
    var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) { var p = req.call(stage); if (p && p.then) p.then(focusGame).catch(function () { location.href = src; }); else setTimeout(focusGame, 60); }
    else location.href = src;   // iPhone Safari: open the game on its own page (it has its own way back)
  });
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function exitFs() { var x = document.exitFullscreen || document.webkitExitFullscreen; if (x && fsEl()) x.call(document); }
  document.getElementById('fsExit').addEventListener('click', function (e) { e.stopPropagation(); exitFs(); });
  // the exit bar fades back after a few seconds; any movement brings it back
  var fsbar = document.getElementById('fsbar'), dimT = 0;
  function wake() { fsbar.classList.remove('dim'); clearTimeout(dimT); dimT = setTimeout(function () { fsbar.classList.add('dim'); }, 2600); }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) { document.addEventListener(ev, function () { if (fsEl()) wake(); setTimeout(focusGame, 50); }); });
  stage.addEventListener('pointermove', wake);
  // Keys pressed while the page (not the game) has focus — e.g. right after clicking Full screen — are passed to the game.
  var GAME_KEYS = /^( |Enter|Escape|Backspace|Arrow(Up|Down|Left|Right)|[wasdpmlyWASDPMLY1-5])$/;
  ['keydown', 'keyup'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (!GAME_KEYS.test(e.key) || document.activeElement === frame) return;
      var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      if (e.key === ' ' || e.key === 'Enter' || /^Arrow/.test(e.key)) e.preventDefault();
      if (type === 'keydown' && e.key === 'Escape' && fsEl()) return;   // the browser uses Esc to leave full screen
      try { frame.contentWindow.postMessage({ arcade: 'key', type: type, key: e.key, code: e.code, repeat: e.repeat }, location.origin); } catch (x) {}
      if (type === 'keydown') focusGame();
    });
  });
  document.getElementById('share').addEventListener('click', function () {
    var url = location.origin + location.pathname + '?g=' + g.slug, btn = this;
    if (navigator.share) navigator.share({ title: g.title, text: g.tagline, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { btn.textContent = 'Link copied'; setTimeout(function () { btn.textContent = 'Share'; }, 1800); });
  });
  // Scores from the game (same-origin house games only; member games will run on their own origin).
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (d.arcade === 'over' && d.game === g.slug) {
      var b = best(); document.getElementById('best').textContent = b || '—';
      if (AC && AC.signedIn()) AC.sync(g.slug, 'over').then(function (j) { where(); if (j && lb) { lb.refresh(); AC.toast('Saved to your account'); } });
    }
    if (d.arcade === 'exit' && d.game === g.slug) { exitFs(); location.href = './'; }
  });
})();
</script>
</body>
</html>
