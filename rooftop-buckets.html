<!-- Rooftop Buckets — ContentPad Arcade (build 2026102801-rb)
     Arcade basketball (pop-a-shot style) on a Manhattan rooftop at night, in 3D. Aim, hold to charge, release
     on the sweet spot. 60-second rounds: 2 points a bucket, 3 in the last 20 seconds while the hoop slides.
     Three in a row and you're on fire (double points). Streak mode: miss once and it's over. 2 Players: two hoops,
     one keyboard or two controllers, split screen. Original art: skyline, court and ball are built in code.
     Posts {arcade:'start'|'over'}; save in localStorage (rb_save), cloud via account.js. -->
<title>Rooftop Buckets · ContentPad Arcade</title>

<style>
