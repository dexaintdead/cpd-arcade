<style>.lbgrid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.lbgrid .card h4 small{color:var(--mute);letter-spacing:.1em}
/* Brand pages: the landing pages that wrap a game (2026-10-07) */
.bp{position:relative}
.bp>button{padding:8px 14px;border-radius:999px;color:var(--dim);font:700 13px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent;background:none;cursor:pointer}
.bp>button:hover,.bp.open>button{color:#fff;background:rgba(61,107,255,.22);border-color:var(--line2);box-shadow:0 0 16px rgba(61,107,255,.35)}
.bp .menu{position:absolute;top:calc(100% + 8px);left:0;z-index:40;min-width:340px;display:none;padding:8px;border-radius:14px;background:rgba(6,8,24,.96);border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.bp.open .menu{display:block}
.bp .menu a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:700;text-transform:none;letter-spacing:0;border:0;box-shadow:none;background:none}
.bp .menu a:hover,.bp .menu a:focus-visible{background:rgba(61,107,255,.22)}
.bp .menu img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.bp .menu small{display:block;color:var(--dim);font-weight:600;font-size:12px}
@media (max-width:560px){.bp .menu{left:auto;right:0;min-width:min(300px,calc(100vw - 24px))}}
/* account.js hides the header nav on phones; keep the Brand pages button */
@media (max-width:520px){header.bar .nav{display:flex!important;margin-left:auto}header.bar .nav>a{display:none}.bp>button{padding:7px 10px;font-size:11px;letter-spacing:.04em}}
.bplist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.bplist a{display:flex;gap:14px;align-items:center;padding:12px;border-radius:16px;background:rgba(10,14,40,.6);border:1px solid var(--line);color:#fff;text-decoration:none}
.bplist a:hover{border-color:var(--line2);box-shadow:0 0 22px rgba(61,107,255,.3)}
.bplist img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.bplist b{display:block;font-size:15px}.bplist small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}

<body>
<div class="sky"></div><canvas id="dust"></canvas><div class="scan"></div>
<div id="boot" role="button" tabindex="0" aria-label="Press any button to enter the ContentPad Arcade"><div class="glow"></div><div class="mark"><img src="https://contentpad.io/contentpad-logo-nav.png" alt=""><b class="chrome">ARCADE</b><small class="press">press any button</small></div></div>

<header class="bar"><div class="wrap">
  <a class="logo" href="./" aria-label="ContentPad Arcade home"><img src="https://contentpad.io/contentpad-logo-nav.png" alt="ContentPad"><span class="arc chrome">ARCADE</span></a>
  <nav class="nav" aria-label="Arcade"><a class="on" href="./">Games</a><div class="bp" id="bp" hidden><button type="button" aria-haspopup="true" aria-expanded="false" id="bpBtn">Brand pages ▾</button><div class="menu" role="menu" id="bpMenu"></div></div></nav>
  <span class="clock" id="clock" aria-hidden="true"></span>
</div></header>

<main class="wrap">
  <section class="menu" id="menu" aria-label="Featured game">
    <a class="disc" id="disc" href="#"><img id="discImg" alt=""></a>
    <div class="info" id="info"></div>
  </section>
  <div class="rail" id="rail" role="listbox" aria-label="Choose a game"></div>

  <section class="sec" id="games">
    <h2 class="disp chrome">Games <small id="countLive"></small></h2>
    <div class="grid" id="live"></div>
  </section>

  <section class="sec" id="brandpages" hidden>
    <h2 class="disp chrome">Brand pages <small>the game, on its brand's own page</small></h2>
    <div class="bplist" id="bpList"></div>
  </section>
  <section class="sec" id="boards" hidden>
    <h2 class="disp chrome">Leaderboards <small>top players, all devices</small></h2>
    <div class="grid lbgrid" id="lbs"></div>
  </section>

  <section class="sec">
    <div class="mem"><div class="chipcard" aria-hidden="true"></div><div><h4 id="savesH">SAVE DATA · THIS DEVICE</h4><ul id="saves"></ul></div><button class="btn ghost" type="button" id="savesBtn" style="grid-column:1/-1;justify-self:start;display:none">Sign in to save to the cloud</button></div>
  </section>
</main>

<footer><div class="wrap">
  <span>© 2026 ContentPad Studios · Original games and characters. All rights reserved.</span>
  <span><a href="https://contentpad.io/">contentpad.io</a> · <a href="https://contentpartiesanddeals.com/">The Magazine</a></span>
</div></footer>

<script>
// Wait for the game switches (Arcade HQ → Games), at most 2.5 s; the boot screen covers it.
(window.ArcadeStatus ? window.ArcadeStatus.ready : Promise.resolve()).then(function () {
  'use strict';
  var G = (window.ARCADE_GAMES || []).filter(function (g) { return g.status === 'live' && (!window.ArcadeStatus || window.ArcadeStatus.listed(g.slug)); });
  (function brandPages() {
    var L = G.filter(function (g) { return g.landing && g.landing.url; });
    if (!L.length) return;
    function row(g) {
      return '<img src="' + esc(g.cover) + '" alt="" loading="lazy"><span><b>' + esc(g.landing.title || g.title) + '</b><small>' + esc(g.landing.brand ? g.landing.brand + ' · ' : '') + esc(g.title) + '</small></span>';
    }
    document.getElementById('bpMenu').innerHTML = L.map(function (g) { return '<a role="menuitem" href="' + esc(g.landing.url) + '">' + row(g) + '</a>'; }).join('');
    document.getElementById('bpList').innerHTML = L.map(function (g) { return '<a href="' + esc(g.landing.url) + '">' + row(g) + '</a>'; }).join('');
    document.getElementById('bp').hidden = false; document.getElementById('brandpages').hidden = false;
    var bp = document.getElementById('bp'), btn = document.getElementById('bpBtn');
    function set(on) { bp.classList.toggle('open', on); btn.setAttribute('aria-expanded', on ? 'true' : 'false'); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); set(!bp.classList.contains('open')); });
    document.addEventListener('click', function (e) { if (!bp.contains(e.target)) set(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
  })();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function best(g) { try { var n = +localStorage.getItem(g.slug === 'skyline-dash' ? 'skyline_best' : 'arcade_best_' + g.slug) || 0; return n ? (g.scorePrefix || '') + n.toLocaleString('en-US') : 0; } catch (e) { return 0; } }
  function isNew(g) { return g.released && (Date.now() - new Date(g.released).getTime()) < 21 * 864e5; }
  function href(g) { return 'play.html?g=' + encodeURIComponent(g.slug); }
  function chips(g) {
    return (g.rating ? '<span class="chip r">' + esc(g.rating) + '</span>' : '') + '<span class="chip">' + esc(g.genre) + '</span>' +
      (g.controller ? '<span class="chip">🎮 Controller</span>' : '') + (g.mobile ? '<span class="chip">📱 Phone</span>' : '');
  }
  var sel = 0;
  function show(i, blip) {
    if (!G.length) return;
    sel = (i + G.length) % G.length; var g = G[sel], b = best(g);
    document.getElementById('discImg').src = g.cover; document.getElementById('disc').href = href(g);
    document.getElementById('disc').setAttribute('aria-label', 'Play ' + g.title);
    document.getElementById('info').innerHTML =
      '<div class="kick">' + (sel === 0 ? 'FEATURED' : 'GAME ' + (sel + 1) + ' / ' + G.length) + (g.badge ? ' · ' + esc(g.badge).toUpperCase() : '') + '</div>' +
      '<h1 class="chrome">' + esc(g.title) + '</h1><p>' + esc(g.tagline) + '</p>' +
      '<div class="chips">' + chips(g) + '</div>' +
      '<div class="btns"><a class="btn play" href="' + href(g) + '">▶ Play</a>' + (b ? '<span class="btn ghost">' + esc(g.scoreLabel || 'Best') + ': ' + b + '</span>' : '') + '</div>' +
      (G.length > 1 ? '<div class="hint"><kbd>←</kbd><kbd>→</kbd> choose · <kbd>Enter</kbd> play · controller works too</div>' : '');
    [].forEach.call(document.querySelectorAll('.ring'), function (r, k) { r.classList.toggle('sel', k === sel); r.setAttribute('aria-selected', k === sel); });
    var r = document.querySelectorAll('.ring')[sel]; if (r && blip) r.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    if (blip && window.arcadeBlip) window.arcadeBlip(sel % 2 ? 990 : 880);
  }
  var rail = document.getElementById('rail');
  rail.innerHTML = G.length > 1 ? G.map(function (g, i) { return '<button class="ring" type="button" role="option" data-i="' + i + '"><img src="' + esc(g.cover) + '" alt="" loading="lazy"><span>' + esc(g.title) + '</span></button>'; }).join('') : '';
  if (G.length < 2) rail.remove();
  [].forEach.call(document.querySelectorAll('.ring'), function (r) { r.addEventListener('click', function () { show(+r.dataset.i, true); }); r.addEventListener('dblclick', function () { location.href = href(G[+r.dataset.i]); }); });
  show(0);

  document.getElementById('countLive').textContent = G.length + (G.length === 1 ? ' game' : ' games');
  function paintTiles() { document.getElementById('live').innerHTML = G.map(function (g) {
    var b = best(g);
    return '<a class="tile" href="' + href(g) + '">' +
      '<div class="art"><img src="' + esc(g.cover) + '" alt="" loading="lazy">' + (isNew(g) ? '<span class="badge new">New</span>' : '') + (g.rating ? '<span class="badge r">' + esc(g.rating) + '</span>' : '') + '</div>' +
      '<div class="meta"><h3 class="disp">' + esc(g.title) + '</h3><p>' + esc(g.tagline) + '</p>' +
      '<div class="row">' + chips(g) + (b ? '<span class="chip" style="color:var(--gold)">' + esc(g.scoreLabel || 'Best') + ' ' + b + '</span>' : '') + '</div></div></a>';
  }).join(''); }
  paintTiles();
  function paintSaves() {
    var AC = window.ArcadeAccount, who = AC && AC.player;
    var saves = G.map(function (g) { var b = best(g); return b ? '<li>' + esc(g.title) + ' · <b>' + esc(g.scoreLabel || 'Best') + ' ' + b + '</b></li>' : ''; }).join('');
    document.getElementById('saves').innerHTML = saves || '<li>No save data yet. Play something.</li>';
    document.getElementById('savesH').textContent = who ? 'SAVE DATA · CLOUD · ' + String(who.name).toUpperCase() : 'SAVE DATA · THIS DEVICE';
    document.getElementById('savesBtn').style.display = (AC && !who && window.__arcadeOnline) ? '' : 'none';
  }
  paintSaves();
  (function accounts() {
    var AC = window.ArcadeAccount; if (!AC) return;
    document.getElementById('savesBtn').addEventListener('click', function () { AC.open(); });
    var boards = [];
    AC.online().then(function (on) {
      window.__arcadeOnline = on; paintSaves();
      if (!on) return;
      document.getElementById('boards').hidden = false;
      document.getElementById('lbs').innerHTML = G.map(function (g, i) { return '<div class="card"><h4>' + esc(g.title) + ' <small>· ' + esc(g.scoreLabel || 'Best') + '</small></h4><div id="lb' + i + '"></div></div>'; }).join('');
      boards = G.map(function (g, i) { return AC.board(document.getElementById('lb' + i), g.slug, { limit: 5, prefix: g.scorePrefix }); });
    });
    function refresh() { show(sel); paintSaves(); paintTiles(); boards.forEach(function (b) { b.refresh(); }); }
    AC.onChange(refresh);
    if (AC.signedIn()) Promise.resolve(AC.syncAll()).then(refresh, function () {});
  })();

  /* keyboard + controller navigation of the menu */
  addEventListener('keydown', function (e) {
    if (document.getElementById('boot')) return;
    if (e.key === 'ArrowRight') { show(sel + 1, true); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { show(sel - 1, true); e.preventDefault(); }
    else if (e.key === 'Enter' && document.activeElement === document.body) { location.href = href(G[sel]); }
  });
  var prev = {};
  (function pad() {
    var g = window.ArcadePad ? ArcadePad.read(ArcadePad.first()) : null;
    if (g) {
      var now = { r: g.right, l: g.left, a: g.a || g.start };
      var bt = document.getElementById('boot'); var anyBtn = g.any || g.up || g.down || g.left || g.right;
      if (bt) { if (anyBtn && window.arcadeBootDone) window.arcadeBootDone(); }
      else { if (now.r && !prev.r) show(sel + 1, true); if (now.l && !prev.l) show(sel - 1, true); if (now.a && !prev.a) location.href = href(G[sel]); }
      prev = now;
    }
    requestAnimationFrame(pad);
  })();
});
</script>
