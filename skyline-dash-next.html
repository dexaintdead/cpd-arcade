      else if (isEnd) { if (SAVE.endless) txt('BEST ' + SAVE.endless, x + cw / 2, y + ch - 16, 11, '#f5c542', 'center', false); }
      else { var st = sv ? sv.stars : 0; txt('★★★'.slice(0, st) + '☆☆☆'.slice(0, 3 - st), x + cw / 2, y + ch - 24, 15, '#f5c542', 'center', false); if (sv) txt(String(sv.score), x + cw / 2, y + ch - 9, 10, '#e8dff5', 'center', false); }

  }
  function wrap(s, x, y, maxW, size) {

      cx.strokeStyle = '#f5c542'; cx.lineWidth = 2; cx.stroke(); txt(banner.s, W / 2, H - 69, Math.min(17, (bw - 30) / banner.s.length * 1.9), '#fff', 'center', false); cx.globalAlpha = 1;

  // ── controller ───────────────────────────────────────────────────────────
  var pad = {};
  function pollPad() {
    if (!window.ArcadePad) return;
    var g = ArcadePad.read(ArcadePad.first()); if (!g) return;
    // bottom face jumps / flips · left face, LB or down = TRICK · top face or RB = GRAB (hold) · right face = back
